summary: >
  A document root is a shared base path (folder or URL prefix) registered in 2c8.
  The API does not bind MT documents to a root via the document `prefix` field
  (prefix is only a free-text id/name). After documents are created with full
  absolute URLs that start with the root value, the user runs the 2c8 UI
  “match document roots” action to replace the matching path prefix with a
  real root association.
example: >
  Root value file:///Users/…/Inera/Dokumentbibliotek/ and documents whose
  content is file:///Users/…/Inera/Dokumentbibliotek/2.%20Hantera%20behov/….pdf
  can be matched in the UI so relocating the library only updates the root.
fields:
  key: Stable id (e.g. inera-docs) — used by MCP to look up value when joining URLs; not an MT-document FK
  value: Base URL or folder path (trailing slash; MCP normalizes filesystem → file:///…/)
  titles: Display name per languageId
  type: Stored as mtDocumentRoot by the API
linking:
  - >
    create_document_root({ key, value, title, languageId }) or full body.
    Filesystem value is normalized to file:///…/ with URL-encoded segments.
  - >
    Preferred create: link_document({ documentRootKey, relativePath, title, languageId })
    — MCP looks up root.value and stores type=file with FULL absolute URL
    (root value + URL-encoded relativePath). Does not set API prefix to the root key.
  - >
    Or createDocumentBody with absolute languages.*.content (must include the
    same path prefix as the root value for later UI matching)
  - After mass create: user matches documents to roots in the 2c8 UI
guidance:
  - Always create a document root when many files share one library folder/URL
  - Store full absolute URLs on documents so UI matching can find the root prefix
  - Never treat API prefix as a document-root foreign key
  - When the host/folder moves: update the root value (after UI binding); recreate absolute URLs if still unbound
  - Empty DOC_BASE_URL is not "skip root": use SOURCE_DIR / Dokumentbibliotek as create_document_root value
  - In IMS plans: create_document_root in fas 2 before mass link_document; note UI match as a human step
api:
  list: GET /api/v1/repositories/{repositoryId}/document-roots
  create: POST /api/v1/repositories/{repositoryId}/document-roots
  get: GET /api/v1/repositories/{repositoryId}/document-roots/{documentRootId}
  update: PATCH /api/v1/repositories/{repositoryId}/document-roots/{documentRootId}
  delete: DELETE /api/v1/repositories/{repositoryId}/document-roots/{documentRootId}
mcp:
  listTool: list_document_roots
  createTool: create_document_root
sources:
  - https://support.2c8.com/hc/sv/articles/7293306730397-Vad-%C3%A4r-dokumentr%C3%B6tter-och-vad-anv%C3%A4nds-de-till
