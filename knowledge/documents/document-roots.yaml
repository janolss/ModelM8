summary: >
  A document root is a shared base path (folder or URL prefix) for a set of
  document links. Individual links store the path relative to that root, so
  relocating a whole tree or changing host/URL only requires updating the root
  once — not every link.
example: >
  Documents under https://example.com/docs/ such as
  finance/policy.doc and production/plan.doc share root https://example.com/docs/.
  Moving the library to https://example.se/ims-docs/ means changing only the root;
  the same relative paths then resolve to
  https://example.se/ims-docs/finance/policy.doc and
  https://example.se/ims-docs/production/plan.doc.
fields:
  key: Stable id used as MT document prefix (e.g. ims-docs) — required on create
  value: Base URL or folder path (trailing slash recommended)
  titles: Display name per languageId
  type: Stored as mtDocumentRoot by the API
linking:
  - create_document_root({ key, value, title, languageId }) or full body
  - link_document createDocumentBody: { type: "URL"|"file", prefix: "<key>", languages: { [lang]: { title, content: "relative/path.doc" } }, documentTypes: [...] }
  - Do not repeat the full absolute URL in content when using a root
guidance:
  - Prefer a document root when several links share the same base folder or URL prefix
  - When the host, path prefix, or share moves: update the root value, move the files, links stay valid
  - Absolute one-off URLs that do not share a library base do not need a root
  - In IMS/document-folder plans: inventory shared bases (DOC_BASE_URL, SharePoint library, file share) and propose create_document_root before mass link_document
api:
  list: GET /api/v1/repositories/{repositoryId}/document-roots
  create: POST /api/v1/repositories/{repositoryId}/document-roots
  get: GET /api/v1/repositories/{repositoryId}/document-roots/{documentRootId}
  update: PATCH /api/v1/repositories/{repositoryId}/document-roots/{documentRootId}
  delete: DELETE /api/v1/repositories/{repositoryId}/document-roots/{documentRootId}
mcp:
  listTool: list_document_roots
  createTool: create_document_root
sources:
  - https://support.2c8.com/hc/sv/articles/7293306730397-Vad-%C3%A4r-dokumentr%C3%B6tter-och-vad-anv%C3%A4nds-de-till
