id: naming
patterns:
  process:
    regex: '^\S+\s+.+'
    hint: Infinitive verb + noun (e.g. 'Hantera order')
  activity:
    regex: '^\S+\s+.+'
    hint: Infinitive verb + noun (e.g. 'Registrera order')
  businessObject:
    hint: >
      Noun for the value/artefact/outcome (value stream), e.g. 'Påskrivet
      anställningsavtal'. Avoid status echoes of the activity ('Godkänd X'
      after 'Godkänna X', 'Dokumenterad Y' after 'Dokumentera Y').
  requirement:
    hint: Imperative + direction (e.g. 'Förbättra leveransprecisionen')
  or:
    regex: '.+\?$'
    hint: Question ending with '?' (e.g. 'Finns artikel i lager?'); Ja/Nej on FLOW labels
  vägval:
    regex: '.+\?$'
    hint: Same as or (Regel Eller) — question with '?'
  decision:
    regex: '.+\?$'
    hint: Same as or — question with '?'
  gateway:
    regex: '.+\?$'
    hint: 'Not a create type — use or (Regel Eller). Title still a question with ?'
  role:
    hint: >
      One role name per symbol. If source writes "A och B" for two distinct
      actors (e.g. Projektägare och Projektkontoret), create/reuse two
      symbols and two RACI edges — do not keep the dual title. One combined
      title only for an intentional joint function. "X- och Y…" (hyphen
      before och) is one coordinated compound, not two performers.
  position:
    hint: >
      Same as role: one job title per symbol; split "A och B" dual actors;
      keep "X- och Y…" coordinated compounds as one title.
  organisation:
    hint: >
      Official unit name. Prefer separate organisation symbols when source
      clearly names two units joined only by "och"; keep coordinated
      compounds (hyphen before och) as one title.
swedishInfinitiveExamples:
  - Hantera
  - Registrera
  - Upprätta
  - Godkänna
  - Skicka
  - Granska
  - Besluta
  - Leverera
  - Beställa
  - Kontrollera
sources:
  - https://support.2c8.com/hc/sv/articles/6336377323421-Vilket-objekt-ska-jag-anv%C3%A4nda-i-vilket-sammanhang
