id: gateways
appliesToModelTypes: [process, swimlane]
summary: >
  Branching in 2c8 uses Regel (Eller) and Regel (Och) — NOT a BPMN "gateway"
  type. Exclusive vägval → objectType or. Parallel → objectType and.
  NEVER join. Call resolve_branching_object_type before create.
aliases: [vägval, vagval, gateway, decision, regel, eller, or, and, och, beslut]
guidance:
  - "2c8 has NO object type named gateway for create. Agents that say gateway mean Regel (Eller)."
  - "ALWAYS call resolve_branching_object_type first with ask or query (e.g. gateway) — it returns useObjectType."
  - "Exclusive choice / vägval / decision / xor → objectType or (Regel Eller)"
  - "Parallel split → objectType and (Regel Och)"
  - "Title Eller-rules as questions ('Finns X?'); put Ja/Nej on FLOW edge labels"
  - "Semantics: vägval is a reader aid, not work — nothing changes by passing the diamond. The deciding activity emits the BO that carries the choice; that BO is the basis for the next real activity/process."
  - "Pattern: activity → BO → or → real next activity. Never vägval → BO. Never invent filler activities after the or just to emit a BO. If no in-model fork to different real steps, omit the diamond and keep the decision in the BO."
  - "Layout: Ja continues on the FLOW spine. Nej/side activities sit BELOW the main-path activity (same X as that activity — usually the Ja successor, else the deciding activity), NOT centered under the diamond. Leave vertical room under the upper activity for RACI role and applications before the side activity."
  - "Avoid placing the side activity directly under the Regel symbol — FLOW then often routes backward through the diamond."
  - "search_symbols with objectType=or (or vägval/decision) to reuse existing diamonds"
  - "FORBIDDEN: gateway (as create type), join, förbinda"
rules:
  - id: side-branch-under-main-activity
    severity: warning
    description: >
      Side-branch (Nej) activities should align vertically with the main-path
      activity and sit below it with space for performers/apps — not under the
      or/vägval diamond.

  - id: use-or-not-gateway
    severity: error
    description: >
      Never create objectType gateway. Use objectType or for exclusive vägval
      (Regel Eller). Call resolve_branching_object_type.
  - id: decision-as-question
    severity: warning
    description: >
      Regel (Eller) titles should end with '?'; answers on FLOW edge labels.
  - id: vägval-to-activity
    severity: error
    description: >
      FLOW from or/vägval must go to a real next activity (value-stream work),
      not a business object and not a bookkeeping filler whose only job is to
      recreate the decision as a BO. Decision is taken in the activity before
      the vägval and carried in its output BO.
  - id: never-join
    severity: error
    description: Never use Join / Förbinda.
sources:
  - https://support.2c8.com/hc/sv/articles/6336377323421-Vilket-objekt-ska-jag-anv%C3%A4nda-i-vilket-sammanhang
  - https://support.2c8.com/hc/sv/articles/7185436499741-Processmodell
